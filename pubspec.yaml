name: worklog
description: WorkLog — personal freelance work, productivity & finance tracker.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2

  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4

  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.2
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.5.5
  http: ^1.2.2

  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  sembast: ^3.8.11
  sembast_sqflite: ^2.2.3
  sqflite: ^2.4.4+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

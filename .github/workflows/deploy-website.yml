name: Deploy WorkLog website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: worklog-netlify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build website
        run: npm run build --prefix website
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - name: Check published website routes
        run: |
          test ! -e website/dist/app
          test -f website/dist/verified/index.html
          test -f website/dist/invoice/index.html
      - name: Verify production deploy credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -n "$NETLIFY_SITE_ID"
          test -n "$NETLIFY_AUTH_TOKEN"
      - name: Deploy preview
        if: github.event_name == 'pull_request' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@27.12.0 deploy --dir=website/dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Preview $GITHUB_SHA"
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes netlify-cli@27.12.0 deploy --prod --dir=website/dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Production $GITHUB_SHA"
